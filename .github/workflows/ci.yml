name: CI

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        componente:
          - services/auth-service
          - services/parametrizacion-service
          - gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e libs/common

      - name: Pruebas de ${{ matrix.componente }}
        run: cd ${{ matrix.componente }} && python -m pytest -q

  estilo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - run: ruff check services gateway libs
