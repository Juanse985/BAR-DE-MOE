[project]
name = "barmoe-common"
version = "0.1.0"
description = "Librería compartida por los microservicios del Bar de Moe"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "SQLAlchemy>=2.0",
  "PyJWT>=2.8",
  "bcrypt>=4.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["barmoe_common*"]
