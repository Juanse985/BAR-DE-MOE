line-length = 110
target-version = "py312"
exclude = [".venv", "__pycache__"]

[lint]
select = ["E", "F", "I", "UP", "B"]
# E402: los conftest fijan variables de entorno antes de importar la app, a propósito.
# B008: `Depends(...)` en los argumentos por defecto es el patrón oficial de FastAPI.
ignore = ["E402", "B008"]

[lint.isort]
known-first-party = ["app", "barmoe_common"]

[lint.per-file-ignores]
"**/tests/*" = ["E402"]
"**/conftest.py" = ["E402"]
